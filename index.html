<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#242424" />
    <meta name="color-scheme" content="light dark" />

    <title>Popu-Club</title>
    <meta name="description" content="Popu-Club — lee arcos y capítulos. Plataforma de cómics de Cherry Bless." />
    <meta name="application-name" content="Popu-Club" />
    <meta name="author" content="Cherry Bless" />
    <meta name="robots" content="index,follow" />

    <!-- Iconos -->
    <link rel="icon" type="image/png" href="/loguito.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <!-- PWA / móvil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Popu-Club" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Popu-Club" />
    <meta property="og:title" content="Popu-Club" />
    <meta property="og:description" content="Lee arcos y capítulos en Popu-Club." />
    <meta property="og:image" content="/pwa-512.png" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Popu-Club" />
    <meta name="twitter:description" content="Lee arcos y capítulos en Popu-Club." />
    <meta name="twitter:image" content="/pwa-512.png" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9038529337387769"
     crossorigin="anonymous"></script>

    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light' } catch {}
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg, #cecece);
      }
      html, body, #root, #root * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea, select, [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }
      #root:empty::before {
        content: "Cargando Popu-Club…";
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #ffd700;
        font-family: Arial, sans-serif;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color:#fff;text-align:center;padding:48px;font-family:Arial,sans-serif">
        Popu-Club necesita JavaScript para funcionar.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
